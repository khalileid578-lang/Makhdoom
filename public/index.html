<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - كنيسة العذراء مريم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-box">
    <h2 style="text-align:center; margin-top:0;">🕊️ كنيسة العذراء مريم</h2>
    <p style="text-align:center; font-size:13px; color:#666; margin-top:-8px;">
      خدمة الأنبا أثناسيوس الرسول - اجتماع إعدادي
    </p>
    <label>اسم المستخدم</label>
    <input id="username" placeholder="اسم المستخدم">
    <label>كلمة المرور</label>
    <input id="password" type="password" placeholder="كلمة المرور">
    <div class="actions">
      <button class="btn" style="width:100%" onclick="login()">دخول</button>
    </div>
    <div id="err" class="error-msg"></div>
  </div>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || 'خطأ في الدخول'; return; }
    location.href = '/dashboard.html';
  } catch (e) {
    err.textContent = 'تعذر الاتصال بالسيرفر';
  }
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
